// ============ STATE ============
let data = [];
let sha = null;          // current file sha on GitHub
let dirty = false;       // unsaved local changes
let openId = null;
let editId = null;
let adding = false;
let search = "";
let filter = "all";
let syncMsg = "Laster fra GitHub...";
let syncCls = "";

const sc = s => s >= 9 ? "var(--gold)" : s >= 7.5 ? "var(--green)" : s >= 6 ? "var(--blue)" : s >= 4 ? "var(--gray)" : "var(--red)";
const esc = s => (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const token = () => localStorage.getItem(TOKEN_KEY) || "";
const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;

// ============ GITHUB IO ============
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(str){ return decodeURIComponent(escape(atob(str))); }

async function loadFromGitHub() {
  try {
    const r = await fetch(apiUrl + "?ref=" + GH_BRANCH, {
      headers: { "Accept": "application/vnd.github+json", ...(token() ? {Authorization: "Bearer " + token()} : {}) },
      cache: "no-store"
    });
    if (r.status === 404) {
      // file doesn't exist yet -> seed locally, mark dirty so first save creates it
      data = SEED_DATA; sha = null; dirty = true;
      syncMsg = "Ingen data.json ennå – trykk Lagre for å opprette"; syncCls = "dirty";
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    sha = j.sha;
    data = JSON.parse(b64decode(j.content));
    dirty = false;
    syncMsg = "Synket med GitHub"; syncCls = "ok";
  } catch(e) {
    // fall back to seed
    data = SEED_DATA; sha = null; dirty = true;
    syncMsg = "Kunne ikke laste (" + e.message + ") – bruker innebygd kopi"; syncCls = "err";
  }
}

async function saveToGitHub() {
  if (!token()) { openTokenModal(); return; }
  syncMsg = "Lagrer..."; syncCls = ""; render();
  try {
    const body = {
      message: "Oppdater parfymearkiv " + new Date().toISOString(),
      content: b64encode(JSON.stringify(data, null, 2)),
      branch: GH_BRANCH,
      ...(sha ? { sha } : {})
    };
    const r = await fetch(apiUrl, {
      method: "PUT",
      headers: { "Accept": "application/vnd.github+json", "Authorization": "Bearer " + token(), "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!r.ok) {
      const t = await r.text();
      throw new Error("HTTP " + r.status + (r.status===401?" – ugyldig token":r.status===409?" – konflikt, last på nytt":""));
    }
    const j = await r.json();
    sha = j.content.sha;
    dirty = false;
    syncMsg = "Lagret til GitHub ✔"; syncCls = "ok";
  } catch(e) {
    syncMsg = "Lagring feilet: " + e.message; syncCls = "err";
  }
  render();
}

function markDirty(){ dirty = true; syncMsg = "Ulagrede endringer"; syncCls = "dirty"; }

// ============ TOKEN MODAL ============
let showToken = false;
function openTokenModal(){ showToken = true; render(); }
function saveToken(){
  const v = document.getElementById("tok-input").value.trim();
  if (v) localStorage.setItem(TOKEN_KEY, v);
  showToken = false; render();
}
function clearToken(){ localStorage.removeItem(TOKEN_KEY); showToken = false; render(); }

// ============ CRUD ============
let form = {};
function startAdd(){ form = {name:"",score:"",status:"estimated",owned:false,role:"frontier",profile:"",notes:""}; adding = true; editId = null; openId = null; render(); }
function startEdit(f){ form = {role:"wardrobe", ...f}; editId = f.id; adding = false; render(); }
function cancelForm(){ adding = false; editId = null; render(); }
function setF(k,v){ form[k] = v; }

function saveForm(){
  if (!form.name || form.score === "") return;
  if (editId != null) {
    data = data.map(f => f.id === editId ? {...form, id: editId, score: parseFloat(form.score)} : f);
  } else {
    const maxId = data.reduce((m,f) => Math.max(m, f.id), 0);
    data.push({...form, id: maxId + 1, score: parseFloat(form.score)});
  }
  data.sort((a,b) => b.score - a.score);
  adding = false; editId = null;
  markDirty(); render();
}
function delItem(id){
  if (!confirm("Slett denne duften?")) return;
  data = data.filter(f => f.id !== id);
  openId = null; markDirty(); render();
}

// ============ FILTER ============
function visible(){
  return data
    .filter(f => filter==="tested"?f.status==="tested":filter==="estimated"?f.status!=="tested":filter==="owned"?f.owned:filter==="t1"?f.score>=9:filter==="t2"?(f.score>=7.5&&f.score<9):(filter==="frontier"||filter==="reference"||filter==="wardrobe")?(f.role||"wardrobe")===filter:true)
    .filter(f => !search || f.name.toLowerCase().includes(search.toLowerCase()) || (f.profile||"").toLowerCase().includes(search.toLowerCase()) || (f.role||"").includes(search.toLowerCase()))
    .sort((a,b) => b.score - a.score);
}

// ============ RENDER ============
function render(){
  const app = document.getElementById("app");
  const tested = data.filter(f=>f.status==="tested").length;
  const owned = data.filter(f=>f.owned).length;
  const t1 = data.filter(f=>f.score>=9).length;
  const fr = data.filter(f=>f.role==='frontier').length;

  const filters = [["all","Alle"],["frontier","⟡ Frontier"],["reference","Referanse"],["wardrobe","Garderobe"],["tested","Testet"],["estimated","Estimert"],["owned","★ Eier"],["t1","9+"],["t2","7.5–8.5"]];

  let html = `
  <div class="header">
    <div><div class="sub">DUFT-DNA · GITHUB</div><div class="title">Parfymearkiv</div></div>
    <button class="btn btn-new" onclick="startAdd()">+ NY</button>
  </div>

  <div class="sync-bar">
    <span class="sync-status ${syncCls}">${esc(syncMsg)}</span>
    <button class="btn btn-sync" onclick="${dirty ? 'saveToGitHub()' : 'reload()'}">${dirty ? 'LAGRE' : 'OPPDATER'}</button>
    <button class="btn btn-key" onclick="openTokenModal()">${token() ? '🔑' : 'TOKEN'}</button>
  </div>

  <div class="controls">
    <input class="search" placeholder="Søk..." value="${esc(search)}" oninput="search=this.value;renderList()">
    <div class="filters">
      ${filters.map(([v,l]) => `<button class="filter ${v} ${filter===v?'active':''}" onclick="filter='${v}';render()">${l}</button>`).join("")}
    </div>
  </div>

  <div class="stats">
    <span><b>${data.length}</b>Totalt</span><span><b>${tested}</b>Testet</span><span><b>${owned}</b>Eier</span><span><b>${t1}</b>9+</span><span><b>${fr}</b>Frontier</span>
  </div>

  <div class="legend">
    <span><i class="dot tested"></i>Testet på hud</span>
    <span><i class="dot estimated"></i>Estimert (ikke testet)</span>
    <span><span style="color:var(--gold)">★</span>Eier</span>
  </div>
  <div class="legend">
    <span>Score:</span>
    <span><i class="sw" style="background:var(--gold)"></i>9+</span>
    <span><i class="sw" style="background:var(--green)"></i>7.5–8.5</span>
    <span><i class="sw" style="background:var(--blue)"></i>6–7</span>
    <span><i class="sw" style="background:var(--gray)"></i>4–5.5</span>
    <span><i class="sw" style="background:var(--red)"></i>under 4</span>
  </div>

  <div id="list">${listHtml()}</div>
  `;

  if (showToken) html += tokenModalHtml();

  app.innerHTML = html;
}

function listHtml(){
  const list = visible();
  return (adding ? formHtml(false) : "")
    + list.map(f => rowHtml(f)).join("")
    + (list.length === 0 ? '<div class="empty-list">INGEN RESULTATER</div>' : "");
}

// Oppdaterer kun listen, så søkefeltet beholder fokus mens man skriver
function renderList(){
  const el = document.getElementById("list");
  if (el) el.innerHTML = listHtml(); else render();
}

function rowHtml(f){
  const isOpen = openId === f.id;
  const isEdit = editId === f.id;
  let h = `<div>`;
  h += `<div class="row ${isOpen||isEdit?'open':''}" onclick="${isEdit?'':'toggle('+f.id+')'}">
    <div class="score" style="color:${sc(f.score)}">${f.score}</div>
    <div style="flex:1;min-width:0">
      <div class="name">${esc(f.name)}${f.owned?' <span style="color:var(--gold);font-size:10px">★</span>':''}${f.role&&f.role!=='wardrobe'?`<span class="role role-${f.role}">${f.role==='frontier'?'⟡ FRONTIER':'REF'}</span>`:''}</div>
      ${f.profile?`<div class="prof">${esc(f.profile)}</div>`:''}
    </div>
    <div class="dot ${f.status==='tested'?'tested':'estimated'}" title="${f.status==='tested'?'Testet på hud':'Estimert (ikke testet)'}"></div>
  </div>`;
  if (isOpen && !isEdit) {
    h += `<div class="detail">
      ${f.notes ? `<div class="notes">${esc(f.notes)}</div>` : `<div class="empty">IKKE TESTET</div>`}
      <div class="detail-actions">
        <button class="btn btn-edit" onclick="startEdit(${JSON.stringify(f).replace(/"/g,'&quot;')})">REDIGER</button>
        <button class="btn btn-del" onclick="delItem(${f.id})">SLETT</button>
      </div>
    </div>`;
  }
  if (isEdit) h += formHtml(true);
  h += `</div>`;
  return h;
}

function formHtml(inline){
  return `<div class="form ${inline?'inline':''}">
    <label>${editId!=null?'REDIGER':'NY DUFT'}</label>
    <label>NAVN</label>
    <input value="${esc(form.name)}" oninput="setF('name',this.value)">
    <div class="form-row">
      <div><label>SCORE</label><input type="number" step="0.5" min="0" max="10" value="${esc(String(form.score))}" oninput="setF('score',this.value)"></div>
      <div><label>STATUS</label><select onchange="setF('status',this.value)">
        <option value="estimated" ${form.status==='estimated'?'selected':''}>Estimert</option>
        <option value="tested" ${form.status==='tested'?'selected':''}>Testet</option>
      </select></div>
    </div>
    <label>ROLLE</label>
    <select onchange="setF('role',this.value)">
      <option value="frontier" ${form.role==='frontier'?'selected':''}>Frontier – utfall usikkert, vil oppdatere DNA</option>
      <option value="reference" ${form.role==='reference'?'selected':''}>Referanse – hudtestet, forankrer en akse</option>
      <option value="wardrobe" ${form.role==='wardrobe'?'selected':''}>Garderobe – kjent territorium</option>
    </select>
    <label>PROFIL</label>
    <input value="${esc(form.profile)}" oninput="setF('profile',this.value)">
    <label>NOTATER</label>
    <textarea rows="3" oninput="setF('notes',this.value)">${esc(form.notes)}</textarea>
    <div class="checkrow"><input type="checkbox" id="own" ${form.owned?'checked':''} onchange="setF('owned',this.checked)"><label for="own">EIER DENNE</label></div>
    <div class="form-actions">
      <button class="btn btn-save" onclick="saveForm()">OK</button>
      <button class="btn btn-cancel" onclick="cancelForm()">AVBRYT</button>
    </div>
  </div>`;
}

function tokenModalHtml(){
  return `<div class="modal-bg" onclick="if(event.target===this){showToken=false;render()}">
    <div class="modal">
      <h3>GitHub-token</h3>
      <p>Limes inn for å lagre endringer til GitHub. Lagres kun lokalt i denne nettleseren – sendes aldri andre steder. Trenger Contents: Read and write på repoet.</p>
      <input id="tok-input" type="password" placeholder="github_pat_..." value="${esc(token())}">
      <div class="modal-actions">
        <button class="btn btn-save" onclick="saveToken()">LAGRE TOKEN</button>
        ${token()?'<button class="btn btn-del" onclick="clearToken()">FJERN</button>':''}
        <button class="btn btn-cancel" onclick="showToken=false;render()">LUKK</button>
      </div>
    </div>
  </div>`;
}

function toggle(id){ openId = openId === id ? null : id; render(); }
async function reload(){ syncMsg="Laster..."; syncCls=""; render(); await loadFromGitHub(); render(); }

// ============ INIT ============
(async function(){
  await loadFromGitHub();
  render();
})();
</script>
